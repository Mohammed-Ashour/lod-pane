name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build-macos:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build packages
        run: python tools/build.py

      - name: Test Word installation packages
        run: python tests/test_word_install.py

      - name: Run runtime tests
        run: python tests/test_runtime.py

      - name: Build and smoke-test native macOS app
        run: bash tools/native/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            dist/lod-pane-word-macos.zip
            dist/lod-pane.oxt
            dist/word-manifest.xml
            dist/lod-pane-word.zip
            dist/SHA256SUMS
            dist/lod-pane-word-macos-arm64.pkg

  build-windows:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build packages
        run: python tools/build.py

      - name: Test Word installation packages
        run: python tests/test_word_install.py

      - name: Run runtime tests
        run: python tests/test_runtime.py

      - name: Build and smoke-test native Windows app
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.16.0 cryptography==43.0.3
          if ($LASTEXITCODE -ne 0) { throw "Installing native build dependencies failed with exit code $LASTEXITCODE." }
          python tests/test_native_word.py
          if ($LASTEXITCODE -ne 0) { throw "Native Word tests failed with exit code $LASTEXITCODE." }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name LOD-pane-Word --paths . --paths tools --workpath dist/native-build --copy-metadata cryptography --copy-metadata cffi --add-data "word;word" --add-data "SETUP.md;." --add-data "dist/word-manifest.xml;dist" tools/native_word.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE." }
          python tools/native/copy_licenses.py dist/LOD-pane-Word
          if ($LASTEXITCODE -ne 0) { throw "Copying third-party license notices failed with exit code $LASTEXITCODE." }
          $smoke = Start-Process -FilePath "dist\LOD-pane-Word\LOD-pane-Word.exe" -ArgumentList @("--self-test", "--no-dialog") -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            $diagnostics = Join-Path ([System.IO.Path]::GetTempPath()) "lod-native-smoke-diagnostics\companion.log"
            if (Test-Path $diagnostics) { Get-Content $diagnostics }
            throw "Frozen app smoke test failed with exit code $($smoke.ExitCode)."
          }
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
            $candidate = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
            if (Test-Path $candidate) { $iscc = $candidate }
          }
          if (-not $iscc) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed with exit code $LASTEXITCODE." }
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
            if (-not $iscc) {
              $candidate = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
              if (Test-Path $candidate) { $iscc = $candidate }
            }
          }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) was not found." }
          & $iscc tools/native/windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/lod-pane-word-windows.zip
            dist/lod-pane-word-windows-x64.exe

  publish:
    needs: [build-macos, build-windows]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate and verify release checksums
        working-directory: dist
        run: |
          sha256sum *.zip *.oxt *.xml *.pkg *.exe > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Prepare release metadata
        id: release
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid workflow run commit SHA" >&2
            exit 1
          fi
          short_sha="${HEAD_SHA:0:12}"
          tag="preview-${short_sha}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          printf 'Preview build for commit %s.\n\nNative Word installers are included for macOS arm64 (.pkg) and Windows x64 (.exe). They bundle the runtime, so users do not need Python or Node.js. The macOS app requests localhost certificate trust and completes Word registration and login startup on first launch. The Windows installer opens the app setup wizard after installation, which requests certificate trust and configures startup. These unsigned preview packages may be blocked by OS or organization policy.\n\nThe script ZIPs remain available as an alternative. They require Python 3.9 or later and Node.js 22 LTS for certificate setup, and include install-word.command or install-word.cmd with login startup, stop, and uninstall support.\n\nThe LibreOffice OXT installs as a standalone Writer extension and does not need the Word companion server. Real Word acceptance testing remains unverified. See [SETUP.md](https://github.com/%s/blob/%s/SETUP.md) for setup and sideloading instructions.' "$HEAD_SHA" "$GH_REPO" "$HEAD_SHA" > release-notes.md
          cat >> release-notes.md <<'NOTES'


          ### macOS unsigned preview approval

          If macOS shows "Not Opened", choose **Done**, then go to **System Settings > Privacy & Security > Security** and select **Open Anyway** for the PKG. Authenticate and confirm **Open**. After installation, open **LOD-pane-Word** in Applications; approve that app separately if prompted.

          Only approve a release you trust. Keep Gatekeeper enabled. [Apple's instructions](https://support.apple.com/en-us/102445) explain this per-download exception.
          NOTES

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish prerelease
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          HEAD_SHA: ${{ steps.release.outputs.sha }}
        run: >-
          gh release create "$TAG"
          dist/lod-pane-word-macos.zip
          dist/lod-pane-word-windows.zip
          dist/lod-pane-word.zip
          dist/lod-pane.oxt
          dist/word-manifest.xml
          dist/SHA256SUMS
          dist/lod-pane-word-macos-arm64.pkg
          dist/lod-pane-word-windows-x64.exe
          --target "$HEAD_SHA"
          --repo "$GH_REPO"
          --prerelease
          --title "LOD pane preview $TAG"
          --notes-file release-notes.md
